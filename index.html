<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ORCA GOLD MINING</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:
    radial-gradient(circle at 50% 20%,#49310b 0%,#17100a 35%,#050505 75%);
    color:white;
    font-family:Arial,sans-serif;
    min-height:100vh;
}

.app{
    max-width:500px;
    margin:auto;
    min-height:100vh;
    padding-bottom:90px;
}

/* HEADER */

.header{
    padding:18px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    background:rgba(10,8,5,.85);
    border-bottom:1px solid #79551b;
}

.logo{
    color:#ffd84d;
    font-size:22px;
    font-weight:900;
    letter-spacing:2px;
}

.balance{
    color:#ffd84d;
    font-weight:bold;
}

/* MINING AREA */

.mine-area{
    text-align:center;
    padding:30px 15px;
}

.title{
    color:#ffd84d;
    font-size:30px;
    font-weight:900;
    margin-bottom:5px;
    text-shadow:0 0 20px #b77b12;
}

.subtitle{
    color:#aaa;
    font-size:13px;
}

/* GOLD MINE */

.mine{
    position:relative;
    width:280px;
    height:220px;
    margin:35px auto 15px;
}

/* ROCK */

.rock{
    position:absolute;
    bottom:10px;
    left:50%;
    transform:translateX(-50%);
    width:230px;
    height:155px;

    background:
    linear-gradient(145deg,#7d5a25,#3b2811 45%,#15100a);

    border-radius:
    48% 52% 38% 62% /
    58% 43% 57% 42%;

    border:3px solid #a8751d;

    box-shadow:
    inset 0 0 30px #000,
    0 0 35px rgba(255,190,30,.3);
}

/* GOLD INSIDE ROCK */

.gold1,
.gold2,
.gold3,
.gold4{
    position:absolute;
    background:linear-gradient(
        135deg,
        #fff29a,
        #ffd12e,
        #bd7600
    );

    box-shadow:
    0 0 15px #ffcc32;
}

.gold1{
    width:65px;
    height:45px;
    left:30px;
    top:35px;
    transform:rotate(-18deg);
}

.gold2{
    width:45px;
    height:65px;
    right:35px;
    top:25px;
    transform:rotate(20deg);
}

.gold3{
    width:55px;
    height:35px;
    left:85px;
    bottom:20px;
    transform:rotate(12deg);
}

.gold4{
    width:28px;
    height:28px;
    right:80px;
    bottom:45px;
    transform:rotate(45deg);
}

/* PICKAXE */

.pickaxe{
    position:absolute;
    z-index:5;
    top:5px;
    right:15px;

    font-size:80px;

    transform:rotate(-25deg);

    filter:
    drop-shadow(0 0 8px #ffd34e);

    transition:.15s;
}

/* HIT ANIMATION */

.hit{
    animation:hit .35s ease;
}

@keyframes hit{

    0%{
        transform:rotate(-25deg);
    }

    45%{
        transform:
        rotate(25deg)
        translate(-20px,20px);
    }

    100%{
        transform:rotate(-25deg);
    }
}

/* GOLD PARTICLES */

.particle{
    position:absolute;
    width:8px;
    height:8px;
    background:#ffd43b;
    border-radius:50%;
    opacity:0;
}

.p1{left:80px;top:80px}
.p2{left:130px;top:70px}
.p3{left:175px;top:95px}
.p4{left:110px;top:110px}

.explode .particle{
    animation:
    particle .6s ease-out;
}

@keyframes particle{

    0%{
        opacity:1;
        transform:translate(0,0);
    }

    100%{
        opacity:0;
        transform:
        translate(
        var(--x),
        var(--y)
        );
    }
}

/* SPEED */

.speed-box{
    margin:15px auto;
    width:90%;
    padding:15px;

    background:
    linear-gradient(
    135deg,
    rgba(255,207,62,.12),
    rgba(255,255,255,.03)
    );

    border:1px solid #71501a;
    border-radius:15px;
}

.speed{
    color:#ffd84d;
    font-size:22px;
    font-weight:900;
}

/* COINS */

.coins{
    font-size:34px;
    font-weight:900;
    color:#fff0a0;

    text-shadow:
    0 0 15px #ffbd22;
}

/* MINE BUTTON */

.mine-btn{

    width:90%;
    padding:17px;

    border:none;
    border-radius:16px;

    background:
    linear-gradient(
    135deg,
    #fff07a,
    #f4b51b,
    #9b5e00
    );

    color:#211500;

    font-size:19px;
    font-weight:900;

    box-shadow:
    0 8px 25px rgba(255,190,30,.3);

    cursor:pointer;
}

.mine-btn:active{
    transform:scale(.96);
}

/* BOTTOM NAV */

.nav{

    position:fixed;
    bottom:0;
    left:50%;

    transform:translateX(-50%);

    width:min(500px,100%);

    height:72px;

    display:grid;
    grid-template-columns:
    repeat(4,1fr);

    background:#0d0b09;

    border-top:1px solid #654715;
}

.nav a{

    text-decoration:none;
    color:#777;

    display:flex;
    flex-direction:column;

    align-items:center;
    justify-content:center;

    font-size:22px;
}

.nav span{
    font-size:10px;
    margin-top:5px;
}

.nav .active{
    color:#ffd84d;
}

</style>
</head>

<body>

<div class="app">

<div class="header">

<div class="logo">
ORCA MINING
</div>

<div class="balance">
🪙 <span id="balance">0</span>
</div>

</div>


<div class="mine-area">

<div class="title">
GOLD MINING
</div>

<div class="subtitle">
Break the gold mine and earn coins
</div>


<div class="mine" id="mine">

<div class="rock">

<div class="gold1"></div>
<div class="gold2"></div>
<div class="gold3"></div>
<div class="gold4"></div>

</div>


<div class="pickaxe" id="pickaxe">
⛏️
</div>


<div class="particle p1"></div>
<div class="particle p2"></div>
<div class="particle p3"></div>
<div class="particle p4"></div>

</div>


<div class="speed-box">

Mining Speed

<div class="speed">
<span id="speed">200</span>
COINS / HOUR
</div>

</div>


<div class="coins">

🪙 <span id="coins">0</span>

</div>


<button
class="mine-btn"
onclick="mine()">

⛏️  MINE GOLD

</button>

</div>


<div class="nav">

<a class="active" href="index.html">
⛏️
<span>Mining</span>
</a>

<a href="upgrade.html">
⚡
<span>Upgrade</span>
</a>

<a href="referral.html">
👥
<span>Referral</span>
</a>

<a href="ranking.html">
🏆
<span>Ranking</span>
</a>

</div>

</div>


<script>

let coins=0;

let speed=200;


function mine(){

    coins += 5;

    document.getElementById(
        "coins"
    ).innerText =
        Math.floor(coins)
        .toLocaleString();

    document.getElementById(
        "balance"
    ).innerText =
        Math.floor(coins)
        .toLocaleString();


    const pickaxe=
        document.getElementById(
            "pickaxe"
        );

    const mine=
        document.getElementById(
            "mine"
        );


    pickaxe.classList.remove("hit");

    mine.classList.remove("explode");


    void pickaxe.offsetWidth;


    pickaxe.classList.add("hit");

    mine.classList.add("explode");


    setTimeout(()=>{

        pickaxe.classList.remove(
            "hit"
        );

        mine.classList.remove(
            "explode"
        );

    },600);

}

</script>

</body>
</html>
